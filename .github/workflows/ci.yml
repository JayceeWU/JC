name: CI

on:
  push:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check duplicate code
        run: npm run cpd

      - name: Upload duplicate-code report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: copypaste-report
          path: copypaste/
          if-no-files-found: ignore

      - name: Build
        run: npm run build
